<!DOCTYPE html>
<!-- Langue par défaut : anglais, servi sans préfixe d'URL. Les pages /fr/, /de/ et
     /es/ sont pré-rendues avec leur propre attribut, et le client resynchronise
     `document.documentElement.lang` au chargement (cf. i18n/translations.js). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icônes. Le PNG carré est indispensable : Google n'affiche un favicon dans
         ses résultats que s'il est carré, et iOS ignore un apple-touch-icon SVG.
         Le .ico à la racine n'est pas décoratif : Bing (et Google en repli) va le
         chercher sur /favicon.ico sans lire le HTML — sans lui, pas de logo dans
         les résultats de recherche. -->
    <link rel="icon" type="image/x-icon" sizes="48x48 96x96 192x192" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#f9ca24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Geocoins" />

    <!-- Titre, description, canonical, Open Graph, Twitter Card et JSON-LD sont
         injectés ici au build par le plugin `injectSeo` (vite.config.js), à partir
         de src/seo/. Source unique, partagée avec les pages pré-rendues. -->
    <!--seo-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://gateway.sumup.com/gateway/ecom/card/v2/sdk.js" async></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
